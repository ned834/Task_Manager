<h1>Study Planner</h1>

<form method="POST">
  {% csrf_token %}
  <input type="text" name="title" placeholder="Enter task">
  <input type="date" name="due_date">
  <button type="submit">Add</button>
  
</form>

<hr>

{% for task in tasks %}
  <div>
    {% if task.completed %}
      <span style="text-decoration: line-through;">
        {{ task.title }}
      </span>
    {% else %}
      <span>{{ task.title }}</span>
    {% endif %}

    <a href="{% url 'complete' task.id %}">✔️</a>
    <a href="{% url 'delete' task.id %}">❌</a>
  </div>
{% empty %}
  <p>No tasks yet</p>
{% endfor %}
