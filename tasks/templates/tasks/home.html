<!DOCTYPE html>
<html>
<head>
    <title>Study Planner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">📚 Study Planner</h1>

    <!-- Form -->
    <form method="POST" class="d-flex gap-2 mb-4">
        {% csrf_token %}
        <input type="text" name="title" class="form-control" placeholder="Enter task">
        <input type="date" name="due_date" class="form-control">
        <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <!-- Tasks -->
    <div class="card p-3">
        {% for task in tasks %}
            <div class="d-flex justify-content-between align-items-center mb-2">

                <div>
                    {% if task.completed %}
                        <span class="text-decoration-line-through text-muted">
                            {{ task.title }}
                        </span>
                    {% else %}
                        <span>{{ task.title }}</span>
                    {% endif %}

                    {% if task.due_date %}
                        <small class="text-muted"> ({{ task.due_date }})</small>
                    {% endif %}
                </div>

                <div>
                    <a href="{% url 'complete' task.id %}" class="btn btn-success btn-sm">✔</a>
                    <a href="{% url 'delete' task.id %}" class="btn btn-danger btn-sm">✖</a>
                    <a href="{% url 'edit' task.id %}" class="btn btn-secondary btn-sm">✏</a>
                </div>

            </div>
        {% empty %}
            <p class="text-center text-muted">No tasks yet</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
