<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Better font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .edit-card {
            border-radius: 18px;
        }

        .preview-image {
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }

        textarea {
            resize: none;
        }


        .dark-mode {
            background: #121212 !important;
            color: #f8f9fa;
        }

        .dark-mode .card {
            background: #1e1e1e;
            color: #f8f9fa;
        }

        .dark-mode .text-muted {
            color: #b0b0b0 !important;
        }

        .dark-mode .form-control,
        .dark-mode .form-select {
            background: #2b2b2b;
            color: white;
            border-color: #444;
        }

        .dark-mode .form-control::placeholder {
            color: #aaa;
        }

        .dark-mode .form-label {
            color: #f8f9fa;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 700px;">

    <!--
    <div class="d-flex justify-content-end mb-3">
    <button id="darkModeToggle" class="btn btn-outline-secondary">
        Dark Mode
    </button>
    </div>
    -->

    <!-- Title -->
    <h1 class="text-center fw-bold mb-4">
        Edit Task
    </h1>

    <!-- Edit Form -->
    <div class="card p-4 shadow-sm border-0 edit-card">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Title -->
            <div class="mb-3">
                <label class="form-label">
                    Task Title
                </label>

                <input 
                    type="text" 
                    name="title" 
                    class="form-control"
                    value="{{ task.title }}"
                    required
                >
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">
                    Description
                </label>

                <textarea 
                    name="description" 
                    class="form-control"
                    rows="4"
                    placeholder="Add details about the task..."
                >{{ task.description }}</textarea>
            </div>

            <!-- Due Date -->
            <div class="mb-3">
                <label class="form-label">
                    Due Date
                </label>

                <input 
                    type="date" 
                    name="due_date" 
                    class="form-control"
                    value="{{ task.due_date|date:'Y-m-d' }}"
                >
            </div>

            <!-- Upload -->
            <div class="mb-3">
                <label class="form-label">
                    Update Image
                </label>

                <input 
                    type="file" 
                    name="image" 
                    class="form-control"
                    accept="image/*"
                >
            </div>

            <!-- Existing Image -->
            {% if task.image_url %}
            <div class="mb-3">

                <label class="form-label d-block">
                    Current Image
                </label>

                <img 
                    src="{{ task.image_url }}" 
                    class="img-fluid preview-image shadow-sm"
                >

            </div>
            {% endif %}

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Color
                </label>

                <select name="color" class="form-select">
                    <option value="white" {% if task.color == "white" %}selected{% endif %}>Default</option>
                    <option value="blue" {% if task.color == "blue" %}selected{% endif %}>Blue</option>
                    <option value="green" {% if task.color == "green" %}selected{% endif %}>Green</option>
                    <option value="yellow" {% if task.color == "yellow" %}selected{% endif %}>Yellow</option>
                    <option value="red" {% if task.color == "red" %}selected{% endif %}>Red</option>
                    <option value="purple" {% if task.color == "purple" %}selected{% endif %}>Purple</option>
                </select>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between align-items-center mt-4">

                <a href="/" class="btn btn-outline-secondary px-4">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary px-4">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

<script>
const toggleButton = document.getElementById("darkModeToggle");

if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");
    toggleButton.innerHTML = "Light Mode";
}

toggleButton.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    const enabled = document.body.classList.contains("dark-mode");

    localStorage.setItem(
        "darkMode",
        enabled ? "enabled" : "disabled"
    );

    toggleButton.innerHTML =
        enabled ? "Light Mode" : "Dark Mode";
});
</script>

</body>
</html>
